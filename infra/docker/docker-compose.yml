version: '3.8'

services:
  api_gateway:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=postgresql://postgres:postgres@supabase:5432/postgres
      - SUPABASE_KEY=dummy
      - REDIS_URL=redis://redis:6379/0
      - CLOUDFLARE_R2_BUCKET=dummy
      - CLOUDFLARE_R2_ACCESS_KEY=dummy
      - CLOUDFLARE_R2_SECRET_KEY=dummy
      - CLOUDFLARE_ACCOUNT_ID=dummy
      - HF_SPACE_URL=http://ml_space:7860
      - HF_API_TOKEN=dummy
    depends_on:
      - redis
      - ml_space

  celery_worker:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.backend
    command: ["celery", "-A", "app.celery_app.worker", "worker", "--loglevel=info"]
    environment:
      - SUPABASE_URL=postgresql://postgres:postgres@supabase:5432/postgres
      - SUPABASE_KEY=dummy
      - REDIS_URL=redis://redis:6379/0
      - HF_SPACE_URL=http://ml_space:7860
      - HF_API_TOKEN=dummy
    depends_on:
      - redis
      - api_gateway
      - ml_space

  ml_space:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.ml
    ports:
      - "7860:7860"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  supabase:
    image: ankane/pgvector:v0.5.0
    environment:
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
